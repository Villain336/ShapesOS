# --- Marketr self-host: one command to run everything ---
# Usage: copy .env.example to .env, fill in keys, then `docker compose up -d`
# App: http://127.0.0.1:3000 (put a TLS reverse proxy in front; see DEPLOY.md).
# Postgres and Redis are not published; MinIO binds to 127.0.0.1 only.
#
# Required in .env (compose refuses to start without them — no literal
# defaults ship): POSTGRES_PASSWORD, APP_DB_PASSWORD, MINIO_ROOT_PASSWORD.
# Use hex values (`openssl rand -hex 32`) — they are embedded in URLs.
#
# Roles: `migrate` connects as POSTGRES_USER (the superuser that owns the
# schema), applies migrations and creates the runtime role APP_DB_USER
# (NOSUPERUSER NOBYPASSRLS, scripts/db/create-app-role.sql). The app connects
# ONLY as that role, so tenant row-level security is actually enforced.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-marketr}
    volumes:
      - marketr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - marketr-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase B (W3): S3-compatible object storage for the workspace filesystem.
  # Local disk is single-box only — multi-instance deployments must set
  # MARKETR_STORAGE=s3 with the credentials below.
  minio:
    image: minio/minio:RELEASE.2026-01-01T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (openssl rand -hex 32)}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - marketr-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migrator: repairs renamed-migration history, applies all pending
  # migrations, then creates/refreshes the least-privilege app role. The app
  # starts only after it exits successfully.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketr}?schema=public
      APP_DB_USER: ${APP_DB_USER:-marketr_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (openssl rand -hex 32)}

  app:
    build:
      context: .
      target: runner
      args:
        # Shown by GET /api/health and on error reports; optional.
        MARKETR_GIT_COMMIT: ${MARKETR_GIT_COMMIT:-}
    restart: unless-stopped
    # Phase 4a: readiness = database reachable + every migration applied
    # (GET /api/health, 503 otherwise). Liveness alone is /api/health/live.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      # Loopback only: a host reverse proxy (Caddy) terminates TLS in front.
      # Set APP_BIND_ADDR=0.0.0.0 to expose the app port directly.
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Compose-provided; override in .env if needed. The runtime role, never
      # the superuser (superusers bypass FORCE ROW LEVEL SECURITY).
      DATABASE_URL: postgresql://${APP_DB_USER:-marketr_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketr}?schema=public
      REDIS_URL: redis://redis:6379
      # Phase B (W3) filesystem: local disk by default; set MARKETR_STORAGE=s3
      # to use the MinIO service above (multi-instance deployments must).
      MARKETR_STORAGE: ${MARKETR_STORAGE:-local}
      MARKETR_S3_ENDPOINT: ${MARKETR_S3_ENDPOINT:-http://minio:9000}
      MARKETR_S3_REGION: ${MARKETR_S3_REGION:-us-east-1}
      MARKETR_S3_BUCKET: ${MARKETR_S3_BUCKET:-marketr-files}
      MARKETR_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-marketr}
      MARKETR_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}

  # Phase 4a: scheduled database backups (scripts/ops/backup.sh --loop).
  # pg_dump custom format into the marketr-backups volume every
  # BACKUP_INTERVAL_SECONDS (default daily), local copies pruned after
  # BACKUP_RETENTION_DAYS (default 14), optional upload to S3/MinIO when
  # BACKUP_S3_BUCKET is set. Dumps as the schema owner: the app role can't
  # see FORCE-RLS rows. Restore: docs/ops/BACKUP-RESTORE.md.
  backup:
    build:
      context: .
      target: backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BACKUP_DATABASE_URL: postgresql://${POSTGRES_USER:-marketr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketr}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - marketr-backups:/backups

volumes:
  marketr-db:
  marketr-redis:
  marketr-minio:
  marketr-backups:
