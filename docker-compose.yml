# --- Marketr self-host: one command to run everything ---
# Usage: copy .env.example to .env, fill in keys, then `docker compose up -d`
# App: http://localhost:3000 | Postgres: localhost:5432 | Redis: localhost:6379

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketr}
      POSTGRES_DB: ${POSTGRES_DB:-marketr}
    volumes:
      - marketr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - marketr-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase B (W3): S3-compatible object storage for the workspace filesystem.
  # Local disk is single-box only — multi-instance deployments must set
  # MARKETR_STORAGE=s3 with the credentials below.
  minio:
    image: minio/minio:RELEASE.2026-01-01T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marketr-minio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - marketr-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migrator: repairs renamed-migration history, then applies all
  # pending migrations. The app starts only after it exits successfully.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketr}:${POSTGRES_PASSWORD:-marketr}@db:5432/${POSTGRES_DB:-marketr}?schema=public

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Compose-provided defaults; override in .env if needed
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketr}:${POSTGRES_PASSWORD:-marketr}@db:5432/${POSTGRES_DB:-marketr}?schema=public
      REDIS_URL: redis://redis:6379
      # Phase B (W3) filesystem: local disk by default; set MARKETR_STORAGE=s3
      # to use the MinIO service above (multi-instance deployments must).
      MARKETR_STORAGE: ${MARKETR_STORAGE:-local}
      MARKETR_S3_ENDPOINT: ${MARKETR_S3_ENDPOINT:-http://minio:9000}
      MARKETR_S3_REGION: ${MARKETR_S3_REGION:-us-east-1}
      MARKETR_S3_BUCKET: ${MARKETR_S3_BUCKET:-marketr-files}
      MARKETR_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-marketr}
      MARKETR_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-marketr-minio-secret}

volumes:
  marketr-db:
  marketr-redis:
  marketr-minio:
