# --- Marketr self-host: one command to run everything ---
# Usage: copy .env.example to .env, fill in keys, then `docker compose up -d`
# App: http://127.0.0.1:3000 (put a TLS reverse proxy in front; see DEPLOY.md).
# Postgres and Redis are not published; MinIO binds to 127.0.0.1 only.
#
# Day-one defaults (Phase 6): Postgres is the pgvector image (the memory and
# substrate migrations create the `vector` extension; pg_trgm/pgcrypto ship
# with it), uploaded files go to the bundled MinIO (bucket created by the
# one-shot `minio-init`), the remaining on-disk state has named volumes, and
# the API rate limits + login lockout are kept in Postgres
# (RATE_LIMIT_STORE=postgres) so they hold if you run more than one app.
#
# Required in .env (compose refuses to start without them — no literal
# defaults ship): POSTGRES_PASSWORD, APP_DB_PASSWORD, MINIO_ROOT_PASSWORD.
# Use hex values (`openssl rand -hex 32`) — they are embedded in URLs.
#
# Roles: `migrate` connects as POSTGRES_USER (the superuser that owns the
# schema), applies migrations and creates the runtime role APP_DB_USER
# (NOSUPERUSER NOBYPASSRLS, scripts/db/create-app-role.sql). The app connects
# ONLY as that role, so tenant row-level security is actually enforced.

services:
  db:
    # pgvector/pgvector:pg16 = the official postgres:16 image + pgvector. Plain
    # postgres:16-alpine has no `vector`, and the migrations need it (plus
    # pg_trgm and pgcrypto, which are in the image's contrib). Same image as CI.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-marketr}
    volumes:
      - marketr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - marketr-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase B (W3): S3-compatible object storage for the workspace filesystem.
  # Phase 6: the app uses it by default (MARKETR_STORAGE=s3 below), so
  # uploads live in the marketr-minio volume and survive rebuilds.
  #
  # Image: MinIO no longer publishes pullable images (minio/minio and
  # quay.io/minio/minio refuse anonymous pulls as of 2026-10, so the old
  # `minio/minio:RELEASE.…` pin broke every fresh `docker compose up`).
  # Chainguard builds MinIO from source and publishes it free; the -dev
  # variant carries `mc`, `sh` and `wget`, which the healthcheck and
  # minio-init below use. Pinned by digest; set MINIO_IMAGE to override
  # (e.g. your own MinIO build or a newer digest). Runs as uid 65532.
  minio:
    image: ${MINIO_IMAGE:-chainguard/minio:latest-dev@sha256:7c248c1d7832ff65a6345cb6ff7bf9cf081ccf88527f8d6f25bb9227801a5121}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (openssl rand -hex 32)}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - marketr-minio:/data
    healthcheck:
      # MinIO's unauthenticated liveness endpoint (busybox wget in the image).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the files bucket (idempotent) before the app starts.
  # Reuses the minio image for its bundled `mc` client — no extra image.
  minio-init:
    image: ${MINIO_IMAGE:-chainguard/minio:latest-dev@sha256:7c248c1d7832ff65a6345cb6ff7bf9cf081ccf88527f8d6f25bb9227801a5121}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marketr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (openssl rand -hex 32)}
      MARKETR_S3_BUCKET: ${MARKETR_S3_BUCKET:-marketr-files}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc --config-dir /tmp/mc alias set shapes http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc --config-dir /tmp/mc mb --ignore-existing "shapes/$$MARKETR_S3_BUCKET" &&
        echo "bucket $$MARKETR_S3_BUCKET ready"

  # One-shot migrator: repairs renamed-migration history, applies all pending
  # migrations, then creates/refreshes the least-privilege app role. The app
  # starts only after it exits successfully.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketr}?schema=public
      APP_DB_USER: ${APP_DB_USER:-marketr_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (openssl rand -hex 32)}

  app:
    build:
      context: .
      target: runner
      args:
        # Shown by GET /api/health and on error reports; optional.
        MARKETR_GIT_COMMIT: ${MARKETR_GIT_COMMIT:-}
    restart: unless-stopped
    # Phase 4a: readiness = database reachable + every migration applied
    # (GET /api/health, 503 otherwise). Liveness alone is /api/health/live.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      # Loopback only: a host reverse proxy (Caddy) terminates TLS in front.
      # Set APP_BIND_ADDR=0.0.0.0 to expose the app port directly.
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Compose-provided; override in .env if needed. The runtime role, never
      # the superuser (superusers bypass FORCE ROW LEVEL SECURITY).
      DATABASE_URL: postgresql://${APP_DB_USER:-marketr_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketr}?schema=public
      REDIS_URL: redis://redis:6379
      # Phase 6: the app runs its own scheduled sweeps (lib/cron/runner.ts;
      # needs CRON_SECRET in .env). Set CRON_RUNNER=external in .env to use a
      # host crontab instead (DEPLOY.md §3.8).
      CRON_RUNNER: ${CRON_RUNNER:-internal}
      # Workspace files (Phase 6): the bundled MinIO by default. Point the
      # MARKETR_S3_* values at S3/R2 to use those instead; MARKETR_STORAGE=local
      # keeps files on the marketr-data volume (single app container only).
      MARKETR_STORAGE: ${MARKETR_STORAGE:-s3}
      MARKETR_S3_ENDPOINT: ${MARKETR_S3_ENDPOINT:-http://minio:9000}
      MARKETR_S3_REGION: ${MARKETR_S3_REGION:-us-east-1}
      MARKETR_S3_BUCKET: ${MARKETR_S3_BUCKET:-marketr-files}
      MARKETR_S3_ACCESS_KEY: ${MARKETR_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-marketr}}
      MARKETR_S3_SECRET_KEY: ${MARKETR_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}}
      # Rate limits + login lockout shared in Postgres (lib/api/rate-limit-store.ts).
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
      # Phase 8: the `worker` service below runs queued agent work; the app
      # only enqueues. (internal = the app runs it itself; off = no queue.)
      AGENT_WORKER: ${AGENT_WORKER:-external}
    volumes:
      # On-disk state that is not in the files bucket: report/brief PDFs,
      # brand logos, site working copies, fix snapshots, sitemaps, scheduler
      # fallback (.data); agent run recordings (.run-artifacts); the shared
      # knowledge corpus (data/corpus). The runner image pre-creates these
      # owned by the app user, so the named volumes start writable.
      - marketr-data:/app/.data
      - marketr-run-artifacts:/app/.run-artifacts
      - marketr-corpus:/app/data

  # Phase 8: the agent worker — claims agent_jobs (SKIP LOCKED, leased,
  # heartbeated) and runs the agent loop: chat turns handed off by their
  # request, mission launches. Same image source as the app; scale it with
  # `docker compose up -d --scale worker=N` (claims never collide). It needs
  # the same model keys and database role as the app.
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-marketr_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketr}?schema=public
      REDIS_URL: redis://redis:6379
      MARKETR_STORAGE: ${MARKETR_STORAGE:-s3}
      MARKETR_S3_ENDPOINT: ${MARKETR_S3_ENDPOINT:-http://minio:9000}
      MARKETR_S3_REGION: ${MARKETR_S3_REGION:-us-east-1}
      MARKETR_S3_BUCKET: ${MARKETR_S3_BUCKET:-marketr-files}
      MARKETR_S3_ACCESS_KEY: ${MARKETR_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-marketr}}
      MARKETR_S3_SECRET_KEY: ${MARKETR_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
    volumes:
      - marketr-data:/app/.data
      - marketr-run-artifacts:/app/.run-artifacts

  # Phase 4a: scheduled database backups (scripts/ops/backup.sh --loop).
  # pg_dump custom format into the marketr-backups volume every
  # BACKUP_INTERVAL_SECONDS (default daily), local copies pruned after
  # BACKUP_RETENTION_DAYS (default 14), optional upload to S3/MinIO when
  # BACKUP_S3_BUCKET is set. Dumps as the schema owner: the app role can't
  # see FORCE-RLS rows. Restore: docs/ops/BACKUP-RESTORE.md.
  backup:
    build:
      context: .
      target: backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BACKUP_DATABASE_URL: postgresql://${POSTGRES_USER:-marketr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marketr}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - marketr-backups:/backups

volumes:
  marketr-db:
  marketr-redis:
  marketr-minio:
  marketr-backups:
  marketr-data:
  marketr-run-artifacts:
  marketr-corpus:
