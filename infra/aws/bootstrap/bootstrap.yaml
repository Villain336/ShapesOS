# ShapesOS — GitHub Actions OIDC roles (standalone CloudFormation template).
# GENERATED by infra/aws (npm run bootstrap-template) from lib/github-oidc-stack.ts;
# do not edit by hand. Deploy once, from AWS CloudShell, before `cdk bootstrap`:
#   aws cloudformation deploy --template-file bootstrap.yaml \
#     --stack-name shapesos-github-oidc --capabilities CAPABILITY_NAMED_IAM
# (add --parameter-overrides ExistingOidcProviderArn=<arn> if the account
# already has the token.actions.githubusercontent.com provider).
# Full steps: docs/deploy/AWS.md.
Description: "ShapesOS: GitHub Actions OIDC roles for Villain336/ShapesOS (production)"
Parameters:
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of an existing token.actions.githubusercontent.com provider in this account; empty = create one
Conditions:
  CreateProvider:
    Fn::Equals:
      - Ref: ExistingOidcProviderArn
      - ""
Resources:
  GithubProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Url: https://token.actions.githubusercontent.com
    Condition: CreateProvider
  DeployRole885297C3:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:Villain336/ShapesOS:environment:production
            Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateProvider
                  - Fn::GetAtt:
                      - GithubProvider
                      - Arn
                  - Ref: ExistingOidcProviderArn
        Version: 2012-10-17
      Description: "GitHub Actions (production environment): cdk deploy, image push, ECS releases"
      RoleName: shapesos-github-deploy
  DeployRoleDefaultPolicyDC930F96:
