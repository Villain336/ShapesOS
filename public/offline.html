<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ShapesOS — offline</title>
<link rel="icon" href="/pwa/icon-192.png">
<!--
  ShapesOS — Phase 18.3 (WS=flow): the offline page. Static (no user data in
  the file, no CSP nonce): the service worker serves it with its own
  script-src 'self' policy when a navigation fails. /offline.js fills it from
  the per-person read cache and queues new notes and reminders. Colours are
  the Agentic OS tokens: the app posts their live values (light or dark, high
  contrast) and offline.js sets them; the values below are only the light
  defaults for a first visit.
-->
<style>
  :root {
    --aos-canvas: #F3F3F1; --aos-paper: #FFFFFF; --aos-ink: #000000; --aos-muted: #5E5E5B;
    --aos-line: #E2E2DF; --aos-control: #CFCFCB; --aos-focus: #2450E0; --aos-hover-paper: #F3F3F1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --aos-canvas: #121211; --aos-paper: #1C1C1A; --aos-ink: #F2F2EF; --aos-muted: #ABABA5; --aos-line: #2E2E2B; --aos-control: #5A5A55; --aos-focus: #6F8FFF; --aos-hover-paper: #2A2A27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--aos-canvas); color: var(--aos-ink); font: 500 15px/1.45 "Archivo", system-ui, sans-serif; }
  main { max-width: 56rem; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 24px; font-weight: 750; font-stretch: 115%; letter-spacing: -0.01em; }
  h2 { margin: 0 0 8px; font-size: 18px; font-weight: 750; font-stretch: 115%; letter-spacing: -0.01em; }
  p { margin: 0; }
  .muted { color: var(--aos-muted); font-size: 14px; }
  .card { background: var(--aos-paper); border-radius: 14px; box-shadow: 0 0 0 1px var(--aos-line); padding: 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 4px; border-bottom: 1px solid var(--aos-line); }
  li:last-child { border-bottom: 0; }
  .t { font-weight: 600; }
  .s { color: var(--aos-muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { height: 44px; padding: 0 22px; border-radius: 9999px; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; background: var(--aos-ink); color: var(--aos-paper); }
  button.secondary { background: var(--aos-paper); color: var(--aos-ink); box-shadow: inset 0 0 0 1.5px var(--aos-ink); }
  button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--aos-focus); outline-offset: 2px; }
  textarea, input { width: 100%; border-radius: 10px; border: 1.5px solid var(--aos-control); background: var(--aos-paper); color: var(--aos-ink); padding: 10px 12px; font: inherit; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
  details summary { cursor: pointer; font-weight: 600; }
  .note-body { white-space: pre-wrap; font-size: 14px; margin-top: 6px; }
  a { color: inherit; }
</style>
</head>
<body>
<main id="main-content">
  <header class="row" style="justify-content: space-between">
    <div>
      <h1 id="title">You're offline</h1>
      <p class="muted" id="subtitle">Showing the copies saved on this device. New notes and reminders are saved here and sent once you're back online.</p>
    </div>
    <button type="button" id="retry">Try again</button>
  </header>
  <p class="card" id="status" role="status" aria-live="polite" hidden></p>
  <section class="card" aria-labelledby="compose-title">
    <h2 id="compose-title">Add while offline</h2>
    <form id="compose" class="row" style="flex-direction: column; align-items: stretch">
      <label>
        <span id="note-label">New note</span>
        <textarea id="note-text" rows="4" maxlength="20000"></textarea>
      </label>
      <div class="row">
        <button type="submit" id="save-note">Save note when online</button>
        <button type="button" class="secondary" id="save-reminder">Save as a reminder</button>
      </div>
      <p class="muted" id="queued"></p>
    </form>
  </section>
  <div id="sections"></div>
</main>
<script src="/offline.js"></script>
</body>
</html>
