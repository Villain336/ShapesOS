# ShapesOS CI — clean-clone confidence.
#
# Every step must pass with ZERO private credentials. Provider-backed paths run
# in mock mode or skip gracefully (explicit skips, never silent). This is the
# F6 "CI green on clean clone" launch-readiness gate.
#
# NOTE: workflows reference secrets.* only — no hardcoded values, ever.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # pgvector is required by the memory/substrate migrations.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketr
          POSTGRES_PASSWORD: marketr
          POSTGRES_DB: marketr
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Migrator (schema owner). The app/tests connect as APP_DATABASE_URL — a
      # non-superuser role, so FORCE RLS policies are actually enforced.
      DATABASE_URL: postgresql://marketr:marketr@localhost:5433/marketr
      APP_DATABASE_URL: postgresql://marketr_app:marketr_app_ci@localhost:5433/marketr
      # tsc and `next build`'s type-check step OOM at the default heap.
      NODE_OPTIONS: --max-old-space-size=8192
      # Everything else intentionally UNSET: batteries must pass in mock mode.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck (next typegen + tsc)
        run: npm run typecheck

      - name: Secret scan (history)
        run: |
          # Fail if any tracked file in history matches secret shapes, excluding
          # known fixtures (documented in the F6 audit; verify-phase8-memory uses
          # the canonical AWS docs example key as a redaction fixture). gitleaks is preferred
          # when available; this grep set is the fallback.
          if command -v gitleaks >/dev/null; then
            gitleaks detect --source . --no-git -v
          else
            echo "gitleaks not installed; running fallback pattern scan on HEAD"
            ! git grep -I -E 'sk-(live|test)-[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' HEAD -- . ':!scripts/verify-llm-routing.mts' ':!components/SiteIde.tsx' ':!scripts/verify-phase8-memory.mts' ':!docs/phase7-launch-audit.md'
          fi

      - name: Unit tests
        run: npm test

      - name: Migrate a fresh database
        run: sh scripts/db/migrate.sh

      - name: Schema drift guard (migrations == schema.prisma)
        run: node scripts/ci/check-schema-drift.mjs

      - name: Create least-privilege app role
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_role=marketr_app
          -v app_password=marketr_app_ci -f scripts/db/create-app-role.sql

      - name: DB-backed tests (as non-superuser app role)
        run: DATABASE_URL="$APP_DATABASE_URL" MARKETR_CREDENTIALS_KEY="$(openssl rand -hex 32)" npm run test:db

      - name: Launch-readiness battery (F6)
        run: npx tsx scripts/verify-phase7-launch.mts

      - name: Security battery (M11)
        run: node scripts/verify-m11-security.mjs

      - name: Credential-free smoke
        run: npx tsx scripts/smoke-no-creds.mts

      - name: Production build
        # Types were already gated by the Typecheck step above; skip Next's
        # duplicate pass so peak memory fits the runner.
        env:
          SKIP_BUILD_TYPECHECK: "1"
        run: npm run build
