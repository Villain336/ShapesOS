# ShapesOS CI — clean-clone confidence.
#
# Every step must pass with ZERO private credentials. Provider-backed paths run
# in mock mode or skip gracefully (explicit skips, never silent). This is the
# F6 "CI green on clean clone" launch-readiness gate.
#
# NOTE: workflows reference secrets.* only — no hardcoded values, ever.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # pgvector is required by the memory/substrate migrations.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketr
          POSTGRES_PASSWORD: marketr
          POSTGRES_DB: marketr
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Migrator (schema owner). The app/tests connect as APP_DATABASE_URL — a
      # non-superuser role, so FORCE RLS policies are actually enforced.
      DATABASE_URL: postgresql://marketr:marketr@localhost:5433/marketr
      APP_DATABASE_URL: postgresql://marketr_app:marketr_app_ci@localhost:5433/marketr
      # tsc and `next build`'s type-check step OOM at the default heap.
      NODE_OPTIONS: --max-old-space-size=8192
      # Everything else intentionally UNSET: batteries must pass in mock mode.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned (.nvmrc): node:test mock.module behavior differs between
          # 22.22 and 22.23, which once made a test pass locally and fail here.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck (next typegen + tsc)
        run: npm run typecheck

      - name: Secret scan (history)
        run: |
          # Fail if any tracked file in history matches secret shapes, excluding
          # known fixtures (documented in the F6 audit; verify-phase8-memory uses
          # the canonical AWS docs example key as a redaction fixture). gitleaks is preferred
          # when available; this grep set is the fallback.
          if command -v gitleaks >/dev/null; then
            gitleaks detect --source . --no-git -v
          else
            echo "gitleaks not installed; running fallback pattern scan on HEAD"
            ! git grep -I -E 'sk-(live|test)-[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' HEAD -- . ':!scripts/verify-llm-routing.mts' ':!components/SiteIde.tsx' ':!scripts/verify-phase8-memory.mts' ':!docs/phase7-launch-audit.md'
          fi

      - name: Unit tests
        run: npm test

      - name: Migrate a fresh database
        run: sh scripts/db/migrate.sh

      - name: Schema drift guard (migrations == schema.prisma)
        run: node scripts/ci/check-schema-drift.mjs

      - name: Create least-privilege app role
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_role=marketr_app
          -v app_password=marketr_app_ci -f scripts/db/create-app-role.sql

      # Phase 19B (WS=panel): the Dress Rehearsal run suite walks a fixture
      # page in a real headless Chromium (lib/panel/__tests__/run-db.test.ts).
      - name: Install Chromium for the DB suites
        run: npx playwright install chromium

      - name: DB-backed tests (as non-superuser app role)
        run: DATABASE_URL="$APP_DATABASE_URL" MARKETR_CREDENTIALS_KEY="$(openssl rand -hex 32)" npm run test:db

      # Phase 17 (model): the prompt-cache probe — real chat turns against a
      # FAKE Anthropic server (no key, no cost); fails on a cache breaker in
      # the tools + system prefix or a missing 1h breakpoint.
      - name: Prompt-cache probe (Phase 17)
        run: DATABASE_URL="$APP_DATABASE_URL" MARKETR_CREDENTIALS_KEY="$(openssl rand -hex 32)" npx tsx scripts/verify/prompt-cache.mts

      - name: Launch-readiness battery (F6)
        run: npx tsx scripts/verify-phase7-launch.mts

      - name: Security battery (M11)
        run: node scripts/verify-m11-security.mjs

      # Phase 10 (ops-core): a committed ✅ app that loses its model, route,
      # page or test fails here (docs/audit/ODOO-PARITY.md).
      - name: Odoo parity guard (Phase 10)
        run: npx tsx scripts/verify/odoo-parity.mts --check

      - name: Credential-free smoke
        run: npx tsx scripts/smoke-no-creds.mts

      - name: Swap for the production build
        # The build's native compiler outgrows the runner's 8 GB; extra swap
        # keeps the runner alive (scripts/ci/add-swap.sh explains).
        run: sh scripts/ci/add-swap.sh 12

      - name: Production build
        # Types were already gated by the Typecheck step above; skip Next's
        # duplicate pass so peak memory fits the runner.
        env:
          SKIP_BUILD_TYPECHECK: "1"
        run: npm run build

  e2e:
    # Phase 6: the Playwright suite (tests/e2e, playwright.config.ts) against a
    # PRODUCTION build (`next start`), with the server connected as the
    # least-privilege app role. Uses the test-only mock OAuth provider and
    # fixture routes (E2E_MOCK_OAUTH=1, never in production) — no live
    # services, no private credentials. scripts/e2e/run.sh is the same entry
    # point developers run locally.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketr
          POSTGRES_PASSWORD: marketr
          POSTGRES_DB: marketr
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marketr:marketr@localhost:5433/marketr
      APP_DATABASE_URL: postgresql://marketr_app:marketr_app_ci@localhost:5433/marketr
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Migrate a fresh database
        run: sh scripts/db/migrate.sh

      - name: Create least-privilege app role
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_role=marketr_app
          -v app_password=marketr_app_ci -f scripts/db/create-app-role.sql

      - name: Swap for the production build
        run: sh scripts/ci/add-swap.sh 12

      - name: Production build
        # Types are gated by the verify job; skip Next's duplicate pass.
        env:
          SKIP_BUILD_TYPECHECK: "1"
        run: npm run build

      - name: Playwright E2E (next start, app role)
        env:
          CI: "true"
          E2E_SKIP_BUILD: "1"
          # NextAuth v5 behind `next start` on localhost.
          AUTH_TRUST_HOST: "true"
        # run.sh: migrate (no-op here), seed as the owner, start the server as
        # E2E_APP_DATABASE_URL, wait for /login, then `npx playwright test`.
        run: >-
          E2E_DATABASE_URL="$DATABASE_URL" E2E_APP_DATABASE_URL="$APP_DATABASE_URL"
          bash scripts/e2e/run.sh

      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 /tmp/marketr-e2e-server.log || true

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            scripts/e2e/report
            test-results
          retention-days: 7

  infra:
    # Deploy PR: hosting as code never rots. The AWS CDK app (infra/aws, its
    # own package) type-checks, its assertion tests pass and it synthesizes
    # with NO AWS credentials; render.yaml validates against Render's schema
    # and the repo rules; the env plan covers every .env.example key.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/aws/package-lock.json

      - name: Install (infra/aws only)
        working-directory: infra/aws
        run: npm ci

      - name: CDK tests (types, assertions, bootstrap template fresh)
        working-directory: infra/aws
        run: npm test

      - name: cdk synth (no credentials)
        working-directory: infra/aws
        run: npx cdk synth --quiet

      - name: render.yaml (schema + repo rules + env groups)
        run: node scripts/ci/validate-render-blueprint.mjs

  compose:
    # Phase 6: the self-host compose file. Validates `docker compose config`
    # with throwaway secrets, then brings up the pgvector `db` and runs the
    # one-shot `migrate` service (builds only the migrate target — no
    # `next build`), asserts it exits 0, that the extensions and the
    # NOSUPERUSER NOBYPASSRLS app role exist, and that `minio-init` creates the
    # files bucket. The app image itself is built by the production path, not
    # here (cost).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Throwaway compose secrets
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: docker compose config
        run: docker compose config --quiet

      - name: db up (pgvector) + migrate exits 0
        run: |
          docker compose up -d --wait db
          docker compose run --rm --build migrate

      - name: Extensions + least-privilege role present
        run: |
          docker compose exec -T db psql -U marketr -d marketr -v ON_ERROR_STOP=1 -Atc \
            "select string_agg(extname, ',' order by extname) from pg_extension where extname in ('vector','pg_trgm','pgcrypto')" \
            | tee /dev/stderr | grep -qx 'pg_trgm,pgcrypto,vector'
          docker compose exec -T db psql -U marketr -d marketr -Atc \
            "select rolsuper::text || rolbypassrls::text from pg_roles where rolname = 'marketr_app'" \
            | tee /dev/stderr | grep -qx 'falsefalse'

      - name: MinIO up + bucket created
        run: |
          docker compose up -d --wait minio
          docker compose run --rm minio-init

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
