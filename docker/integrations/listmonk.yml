# Marketr — Listmonk email engine sidecar (Phase 12).
#
# SIDECAR CONTRACT (read this before touching):
#   - Listmonk is AGPL-3.0. It runs as a separate container/process and is
#     ONLY ever talked to over HTTP (raw fetch/REST). Never copy, fork, or
#     link Listmonk code into the Marketr codebase or process.
#   - Listmonk runs its own migrations: it MUST have its OWN Postgres
#     database. It cannot share the Marketr `marketr` database. It CAN share
#     the Marketr Postgres CLUSTER on 5433 if you create a dedicated
#     database (`listmonk`) on that cluster and point LISTMONK_DB_HOST /
#     DATABASE-style vars at it — the default below is a dedicated
#     postgres container so the sidecar works with zero changes.
#   - Optional: enable with `--profile listmonk`. Never required for core
#     Marketr boot.
#
# Up:   docker compose -f docker/integrations/listmonk.yml --profile listmonk up -d
# Down: docker compose -f docker/integrations/listmonk.yml --profile listmonk down
#
# Listmonk image: official `listmonk/listmonk:latest` from the project
# maintainers. Default web/admin UI: http://localhost:9000
# Default admin: listmonk / listmonk (change LISTMONK_ADMIN_USER/PASSWORD
# via env before first run).

name: marketr-listmonk

services:
  listmonk-postgres:
    image: postgres:16-alpine
    container_name: marketr-listmonk-postgres
    profiles: ["listmonk"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LISTMONK_DB_USER:-listmonk}
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:-listmonk}
      POSTGRES_DB: ${LISTMONK_DB_NAME:-listmonk}
    volumes:
      - listmonk-pgdata:/var/lib/postgresql/data
    # No published ports by default: only the listmonk container talks to it.
    # To inspect the DB directly, uncomment:
    # ports: ["5434:5432"]

  listmonk:
    image: listmonk/listmonk:latest
    container_name: marketr-listmonk
    profiles: ["listmonk"]
    restart: unless-stopped
    depends_on:
      listmonk-postgres:
        condition: service_started
    environment:
      # Listmonk bootstrap: DB connection it migrates itself.
      LISTMONK_db__host: listmonk-postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${LISTMONK_DB_USER:-listmonk}
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-listmonk}
      LISTMONK_db__database: ${LISTMONK_DB_NAME:-listmonk}
      LISTMONK_db__ssl_mode: disable
      # Admin user created on first install. Prefer overriding via .env.
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-listmonk}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-listmonk}
      # Marketr talks to this sidecar with LISTMONK_USER/LISTMONK_TOKEN.
      # Listmonk supports user/password Basic auth on /api/*. Generate a
      # dedicated non-admin user in Listmonk Settings → Users, or point
      # LISTMONK_TOKEN at the admin password during dev only.
    command: --install --yes --config ""
    ports:
      - "${LISTMONK_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  listmonk-pgdata:
